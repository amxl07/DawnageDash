appId: ${DAWNAGE_E2E_APP_ID}
name: Workout draft and timer survive interruption
---
- runFlow: helpers/sign-in.yaml
- tapOn: "Your training and nutrition plans"
- tapOn:
    id: "plan-current-day"
- tapOn:
    text: "Start Day .*"
- extendedWaitUntil:
    visible: "Edit session details.*"
    timeout: 10000
- runFlow:
    when:
      visible: "(Set|Warm-up) 1 weight in kilograms"
    commands:
      - tapOn: "(Set|Warm-up) 1 weight in kilograms"
      - inputText: "40"
      - tapOn: "(Set|Warm-up) 1 repetitions"
      - inputText: "8"
      - hideKeyboard
- runFlow:
    when:
      visible: "(Set|Warm-up) 1 duration in seconds"
    commands:
      - tapOn: "(Set|Warm-up) 1 duration in seconds"
      - inputText: "45"
      - hideKeyboard
- tapOn:
    text: "Complete set"
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 5000
- tapOn: "Rest options"
- runFlow:
    when:
      visible: "Choose your rest duration."
    commands:
      - tapOn: "90s"
- tapOn:
    text: "Start [0-9]+ second rest"
- assertVisible: "Pause rest timer"
# Background and resume without terminating so the absolute-deadline timer can recover.
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "Pause rest timer"
# Termination separately verifies the workout draft persisted to AsyncStorage.
- stopApp
- launchApp
- runFlow:
    when:
      visible: "Home, your dashboard"
    commands:
      - tapOn: "Your training and nutrition plans"
- runFlow:
    when:
      visible:
        id: "plan-current-day"
    commands:
      - tapOn:
          id: "plan-current-day"
      - tapOn:
          text: "Continue Day .*"
- extendedWaitUntil:
    visible: "Edit session details.*"
    timeout: 10000
- tapOn:
    id: "workout-sets-toggle"
- assertVisible:
    text: "Mark (set|warm-up) 1 incomplete"

# Review is separate from persistence. Return preserves the entered sets.
- tapOn:
    id: "workout-overview"
- tapOn:
    id: "logger-finish"
- assertVisible: "Review your workout"
- tapOn: "Return to editing"
- assertVisible: "Edit session details.*"
