appId: ${DAWNAGE_E2E_APP_ID}
name: Measurements and photo permission entry points
---
- runFlow: helpers/sign-in.yaml
- tapOn: "You, profile and settings"
- tapOn: "Measurements"
- assertVisible: "Measurements"
- tapOn: "Metric: Waist"
- tapOn: "Chest"
- assertVisible: "Metric: Chest"
- scrollUntilVisible:
    element: "Compare measurements"
    direction: DOWN
- tapOn: "Compare measurements"
- tapOn: "Hips"
- assertVisible: "Compare: Hips"
- tapOn: "Compare: Hips"
- tapOn: "No comparison"
- assertVisible: "Compare measurements"
- scrollUntilVisible:
    element:
      id: "measurement-add"
    direction: DOWN
- tapOn:
    id: "measurement-add"
- assertVisible: "Add measurements"
- tapOn:
    text: "Close Add measurements"
- tapOn: "Go back"
- tapOn: "Progress photos"
- assertVisible: "Progress photos"
- tapOn:
    id: "photo-add-current-week"
- assertVisible: "Save photos"
- assertVisible:
    text: '^Photos upload to Dawnage only after you tap Save photos\..*'
- tapOn:
    text: "Close Photos .*"
