appId: ${DAWNAGE_E2E_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-email"
- tapOn:
    id: "login-email"
- inputText: ${DAWNAGE_E2E_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${DAWNAGE_E2E_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
