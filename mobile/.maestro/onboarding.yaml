appId: ${DAWNAGE_E2E_APP_ID}
name: Setup preserves a goal through Back and completes after review
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-email"
- tapOn:
    id: "login-email"
- inputText: ${DAWNAGE_E2E_ONBOARD_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${DAWNAGE_E2E_ONBOARD_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      id: "setup-screen"
    timeout: 20000
- tapOn:
    id: "setup-goal-muscle_gain"
- tapOn:
    id: "setup-continue"
- assertVisible: "Check in with your day"
- tapOn: "Back"
- assertVisible:
    id: "setup-goal-muscle_gain"
- tapOn:
    id: "setup-continue"
- tapOn:
    id: "setup-continue"
- scrollUntilVisible:
    element:
      id: "setup-start-wait_for_coach"
    direction: DOWN
- tapOn:
    id: "setup-start-wait_for_coach"
- scrollUntilVisible:
    element:
      text: "Your timezone"
    direction: DOWN
- assertVisible: "Your timezone"
- assertVisible: "Your focus"
- tapOn:
    id: "setup-continue"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- assertVisible: "Ready when.*"
