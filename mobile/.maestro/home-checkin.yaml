appId: ${DAWNAGE_E2E_APP_ID}
name: Daily record restores an acknowledged draft
---
- runFlow: helpers/sign-in.yaml
- tapOn: "Check in for today"
- assertVisible: "Daily Record"
- scrollUntilVisible:
    element:
      id: "checkin-energy-rating-5"
    direction: DOWN
- tapOn:
    id: "checkin-energy-rating-5"
- scrollUntilVisible:
    element:
      id: "checkin-stress-rating-5"
    direction: DOWN
- tapOn:
    id: "checkin-stress-rating-5"
- tapOn:
    id: "checkin-next"
- assertVisible: "Sleep"
- tapOn: "8 h"
- scrollUntilVisible:
    element: "Daily Record"
    direction: UP
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 10000
- tapOn: "Home, your dashboard"
- tapOn: "Check in for today"
- assertVisible: "Daily Record"
- assertVisible: "Sleep"
- stopApp
- launchApp
- tapOn: "Check in for today"
- assertVisible: "Daily Record"
- assertVisible: "Sleep"
- assertVisible: "Saved on this device"
