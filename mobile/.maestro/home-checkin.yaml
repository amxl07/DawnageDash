appId: com.dawnage.app
name: Home and check-in preserve progress
---
- runFlow: helpers/sign-in.yaml
- assertVisible: "Home, your dashboard"
- tapOn:
    id: "home-today-action"
- assertVisible: "Readiness and energy"
- tapOn:
    id: "checkin-energy-rating-5"
- tapOn:
    id: "checkin-stress-rating-5"
- tapOn:
    id: "checkin-next"
- assertVisible: "Sleep and recovery"
- extendedWaitUntil:
    visible: "Saved on this device"
    timeout: 5000
- stopApp
- launchApp
- runFlow:
    when:
      visible: "Home, your dashboard"
    commands:
      - tapOn: "Check in for today"
- extendedWaitUntil:
    visible: "Sleep and recovery"
    timeout: 10000
- tapOn: "Home, your dashboard"
- assertVisible: "Home, your dashboard"
